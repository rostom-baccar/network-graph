<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rostom's people · 3D friend network</title>
<style>
  :root {
    --bg: #07090e; --panel: #141820; --text: #e8eaed; --muted: #9aa0a6;
    --line: #2a3140; --accent: #7eb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  #app { display: flex; height: 100vh; width: 100vw; }
  aside, #detail {
    flex: 0 0 260px; background: var(--panel); border-right: 1px solid var(--line);
    padding: 14px; overflow: auto; height: 100vh; z-index: 2;
  }
  #detail { flex-basis: 300px; border-right: none; border-left: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 12px; margin: 16px 0 8px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; }
  p, .meta { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0 0 10px; }
  #stage { flex: 1 1 auto; position: relative; min-width: 0; height: 100vh; background: #07090e; }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; }
  .toolbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 3;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: rgba(20,24,32,0.92); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px;
  }
  input, select, button {
    background: #0b0d12; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 9px; font-size: 12px; cursor: pointer;
  }
  button:hover, button.active { border-color: var(--accent); color: var(--accent); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  .legend-row, .cluster-row, .tie {
    display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; cursor: pointer;
  }
  .tie { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #0b0d12; }
  .tie:hover { border-color: var(--accent); }
  .pill {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin: 0 4px 4px 0;
  }
  .stat { display: inline-block; margin-right: 14px; }
  .stat b { display: block; font-size: 18px; color: var(--text); }
  .note-block {
    margin: 12px 0 14px; padding: 12px;
    background: #0b0d12; border: 1px solid var(--line); border-radius: 10px;
  }
  .note-block .label {
    font-size: 11px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 600; margin-bottom: 6px;
  }
  .note-block p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text); }
  .tie-note { display: block; margin-top: 3px; color: #c8cdd5; font-size: 11.5px; line-height: 1.4; }
  #hint {
    position: absolute; bottom: 12px; left: 12px; z-index: 3; font-size: 11px; color: var(--muted);
    background: rgba(20,24,32,0.92); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    max-width: 480px; line-height: 1.4;
  }
  #tooltip {
    position: absolute; z-index: 5; pointer-events: none; display: none; max-width: 280px;
    background: rgba(20,24,32,0.95); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px;
  }
  #tooltip b { display: block; font-size: 13px; margin-bottom: 2px; }
  #tooltip .tip-note { margin-top: 6px; color: #c8cdd5; font-size: 11.5px; line-height: 1.4; }
  #err {
    display: none; position: absolute; inset: 80px 16px 16px; z-index: 10;
    background: #1a1010; border: 1px solid #a44; border-radius: 10px; padding: 16px;
    color: #f0c0c0; white-space: pre-wrap; font-size: 13px; overflow: auto;
  }
</style>
</head>

<div id="app">

      <button id="btnYou">Only you</button>
      <button id="btnSpin" class="active">Auto-rotate</button>
      <button id="btnResetCam">Reset camera</button>
    </div>
    <div id="graph"></div>
    <div id="tooltip"></div>
    <div id="hint">3D spheres = people. Bigger = closer to you. Drag to explore the space.</div>
    <div id="err"></div>
  </div>
  <div id="detail">
    <h1 id="dName">Select someone</h1>
    <div id="dPills"></div>
    <div id="dStats"></div>
    <div class="note-block">
      <div class="label">Note</div>
      <p id="dNote">Click a ball in the 3D graph.</p>
    </div>
    <h2>Ties</h2>
    <div id="dTies"></div>
  </div>
</div>

      w: Math.max(480, stage.clientWidth || window.innerWidth - 560),
      h: Math.max(480, stage.clientHeight || window.innerHeight),
    };
  }

  function clusterAnchor(primary, R = 200) {
    const meta = CLUSTERS[primary] || CLUSTERS.core;
    if (primary === "core") return { x: 0, y: 0, z: 0 };
    const a = (meta.angle * Math.PI) / 180;
    const elev = meta.elev || 0;
    const r = R * Math.cos(elev * Math.PI / 2);
    return {
      x: Math.cos(a) * r,
      y: Math.sin(elev * Math.PI) * R * 0.7,
      z: Math.sin(a) * r,
    };
  }

  function nodeColor(d) {
    if (state.selected && d.id !== state.selected && !state.neigh.has(d.id)) return "#333842";
    return d.id === "rostom" ? "#7eb6ff" : (CLUSTERS[d.primary]?.color || "#aaa");
  }

  function nodeVal(d) {
    return d.id === "rostom" ? 36 : 6 + (d.withYou || 1) * 3.5;
  }

  function filteredGraph() {
    const q = state.search.trim().toLowerCase();
    const nodes = DATA.people.filter(p => {
      if (p.id === "rostom") return true;
      if (state.cluster !== "all" && !p.clusters.includes(state.cluster)) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.country.toLowerCase().includes(q)) return false;
      return true;
    }).map(p => {
      const c = clusterAnchor(p.primary);
      return {
        id: p.id,
        name: p.name,
        country: p.country,
        primary: p.primary,
        clusters: p.clusters,
        note: p.note,
        withYou: p.withYou,
        poetry: p.poetry,
        status: p.status,
        x: c.x + (Math.random() - 0.5) * 40,
        y: c.y + (Math.random() - 0.5) * 40,
        z: c.z + (Math.random() - 0.5) * 40,
      };
    });
    const ids = new Set(nodes.map(n => n.id));
    const links = DATA.edges.filter(e => {
      if (!ids.has(e.a) || !ids.has(e.b)) return false;
      if (e.strength < state.minStrength) return false;

    document.getElementById("nPeople").textContent = nodes.length;

        : "";
      tooltip.style.display = "block";
      tooltip.innerHTML = `<b>${node.name}</b>${node.country}<br>${node.withYou}/5 · ${CLUSTERS[node.primary]?.label || ""}${tipNote}`;
    })
    .onNodeClick(node => {
      if (!node) return;
      state.selected = node.id;
      updateNeigh();
      renderDetail(node.id);
      Graph.nodeColor(nodeColor).linkColor(Graph.linkColor());
      Graph.cameraPosition(
        { x: node.x + 100, y: node.y + 50, z: node.z + 180 },
        { x: node.x, y: node.y, z: node.z },
        700
      );
    });

  // Simple forces only — avoid custom forces that can NaN
  Graph.d3Force("charge").strength(-140);
  Graph.d3Force("center").strength(0.05);

  graphEl.addEventListener("mousemove", e => {
    const rect = stage.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 14) + "px";
    tooltip.style.top = (e.clientY - rect.top + 14) + "px";
  });

  function updateNeigh() {
    state.neigh = new Set();
    const sid = state.selected;
    if (!sid) return;
    Graph.graphData().links.forEach(l => {
      const a = l.source.id || l.source;
      const b = l.target.id || l.target;
      if (a === sid) state.neigh.add(b);
      if (b === sid) state.neigh.add(a);
    });
  }

  function applyLinkForce() {
    const link = Graph.d3Force("link");
    if (!link) return;
    link.distance(l => {
      const a = peopleById[l.source.id || l.source];
      const b = peopleById[l.target.id || l.target];
      const same = a && b && a.primary === b.primary;
      return (same ? 28 : 70) + (5 - (l.strength || 1)) * 8;
    }).strength(l => {
      const a = peopleById[l.source.id || l.source];
      const b = peopleById[l.target.id || l.target];
      const same = a && b && a.primary === b.primary;
      return (same ? 0.7 : 0.12) * ((l.strength || 1) / 5);
    });
  }

  function renderDetail(id) {
    const p = peopleById[id];
    if (!p) return;
    document.getElementById("dName").textContent = p.name;
    document.getElementById("dPills").innerHTML = [
      p.country, `${p.withYou}/5 closeness`, CLUSTERS[p.primary]?.label || p.primary
    ].concat(p.status ? [p.status] : [])
      .map(t => `<span class="pill">${t}</span>`).join("");
    document.getElementById("dNote").textContent = p.note || "No note.";
    document.getElementById("dStats").innerHTML =
      `<span class="stat"><b>${p.poetry}</b>poetry nights</span>`;
    const ties = DATA.edges.filter(e => e.a === id || e.b === id)
      .sort((a,b) => b.strength - a.strength);
    document.getElementById("dTies").innerHTML = ties.map(e => {
      const other = e.a === id ? e.b : e.a;
      const o = peopleById[other];
      const noteLine = e.note ? `<span class="tie-note">${e.note}</span>` : "";
      return `<div class="tie" data-id="${other}">
        <div style="flex:1">
          <div style="color:var(--text);font-weight:600">${o?.name || other}</div>
          <div style="color:var(--muted)">${REL[e.type]?.label || e.type} · ${e.strength}/5</div>
          ${noteLine}
        </div>
        <span class="swatch" style="background:${CLUSTERS[o?.primary]?.color || "#666"}"></span>
      </div>`;
    }).join("");
    document.querySelectorAll(".tie").forEach(el => {
      el.addEventListener("click", () => {
        const node = Graph.graphData().nodes.find(n => n.id === el.dataset.id);
        state.selected = el.dataset.id;
        updateNeigh();
        renderDetail(state.selected);
        Graph.nodeColor(nodeColor);
        if (node) {
          Graph.cameraPosition(
            { x: node.x + 100, y: node.y + 50, z: node.z + 180 },
            { x: node.x, y: node.y, z: node.z },
            700
          );
        }
      });
    });
  }

  function build() {
    const g = filteredGraph();
    Graph.graphData(g);
    applyLinkForce();
    const { w, h } = dims();
    Graph.width(w).height(h);
    updateNeigh();
    renderDetail(state.selected);
    Graph.nodeColor(nodeColor);
    Graph.cameraPosition({ x: 0, y: 140, z: 520 }, { x: 0, y: 0, z: 0 }, 0);

    requestAnimationFrame(() => {
      const canvas = graphEl.querySelector("canvas");
      if (!canvas) showErr("WebGL canvas missing — try Chrome/Edge/Firefox with hardware acceleration on.");
      else console.log("3D ready", g.nodes.length, canvas.width, canvas.height);
    });
  }

  function setupChrome() {
    document.getElementById("relLegend").innerHTML = Object.values(REL).map(v =>
      `<div class="legend-row"><span class="swatch" style="background:${v.color}"></span>${v.label}</div>`
    ).join("");
    const cBox = document.getElementById("clusterLegend");
    const sel = document.getElementById("clusterFilter");
    for (const [id, meta] of Object.entries(CLUSTERS)) {
      if (id === "core") continue;
      sel.insertAdjacentHTML("beforeend", `<option value="${id}">${meta.label}</option>`);
      cBox.insertAdjacentHTML("beforeend",
        `<div class="cluster-row" data-c="${id}"><span class="swatch" style="background:${meta.color}"></span>${meta.label}</div>`);
    }
    cBox.querySelectorAll(".cluster-row").forEach(el => {
      el.addEventListener("click", () => {
        state.cluster = el.dataset.c;
        sel.value = state.cluster;
        build();
      });
    });
    document.getElementById("search").oninput = e => { state.search = e.target.value; build(); };
    sel.onchange = e => { state.cluster = e.target.value; build(); };
    document.getElementById("minStrength").onchange = e => { state.minStrength = +e.target.value; build(); };
    document.getElementById("btnAll").onclick = () => {
      state.cluster = "all"; state.search = ""; state.hideWeak = false; state.onlyYou = false; state.minStrength = 1;
      document.getElementById("search").value = "";
      document.getElementById("clusterFilter").value = "all";
      document.getElementById("minStrength").value = "1";
      document.getElementById("btnWeak").classList.remove("active");
      document.getElementById("btnYou").classList.remove("active");
      build();
    };
    document.getElementById("btnWeak").onclick = e => {
      state.hideWeak = !state.hideWeak; e.target.classList.toggle("active", state.hideWeak); build();
    };
    document.getElementById("btnYou").onclick = e => {
      state.onlyYou = !state.onlyYou; e.target.classList.toggle("active", state.onlyYou); build();
    };
    document.getElementById("btnSpin").onclick = e => {
      state.spin = !state.spin;
      e.target.classList.toggle("active", state.spin);
    };
    document.getElementById("btnResetCam").onclick = () => {
      Graph.cameraPosition({ x: 0, y: 140, z: 520 }, { x: 0, y: 0, z: 0 }, 800);
    };
    const pause = () => {
      state._userNav = true;
      clearTimeout(pause._t);
      pause._t = setTimeout(() => { state._userNav = false; }, 2200);
    };
    graphEl.addEventListener("pointerdown", pause);
    graphEl.addEventListener("wheel", pause, { passive: true });
  }

  let angle = 0;
  (function spin() {
    if (state.spin && !state._userNav) {
      const cam = Graph.cameraPosition();
      const r = Math.hypot(cam.x, cam.z) || 520;
      angle += 0.002;
      Graph.cameraPosition({ x: r * Math.sin(angle), y: cam.y, z: r * Math.cos(angle) });
    }
    requestAnimationFrame(spin);
  })();

  setupChrome();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const { w, h } = dims();
    Graph.width(w).height(h);
    build();
  }));
  window.addEventListener("resize", () => {
    const { w, h } = dims();
    Graph.width(w).height(h);
  });
} catch (e) {
  showErr("Could not start the 3D graph:\n\n" + (e && e.stack ? e.stack : e));
}
</script>
</body>
</html>
